# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name xicom.fr www.xicom.fr;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name xicom.fr www.xicom.fr;

    ssl_certificate     /etc/letsencrypt/live/xicom.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xicom.fr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ⭐ AJOUTER CETTE LIGNE POUR AUGMENTER LA LIMITE
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⭐ AUGMENTER LES TIMEOUTS POUR LES GROS FICHIERS
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # ⭐ AJOUTER CES LIGNES POUR ÉVITER LES PROBLÈMES DE BUFFER
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_buffer_size 50M;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
}