<!-- PANNEAU DROIT -->
<div class="main-area">
  <header>
    <button (click)="toggleSidebar()" class="sidebar-toggle">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h1>Gestion des Abonnées</h1>
    <div class="spacer"></div>
  </header>

  <div class="ab-container">

    <!-- Compteur -->
    <div class="ct-count-card">
      <div class="ct-count-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div>
        <p class="ct-count-label">Total abonnés</p>
        <p class="ct-count-value">{{ abonneCount }}</p>
      </div>
    </div>

    <!-- Grille 5 par ligne -->
    <div class="ab-grid">
      <div class="ab-card" *ngFor="let abonne of pagedAbonnes">
        <div class="ab-avatar">{{ abonne.name.charAt(0).toUpperCase() }}</div>
        <p class="ab-name">{{ abonne.name }}</p>
        <p class="ab-email">{{ abonne.email }}</p>
      </div>
    </div>

    <p class="ct-empty" *ngIf="abonnes.length === 0">Aucun abonné pour le moment.</p>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">‹</button>
      <button
        *ngFor="let p of pages"
        (click)="changePage(p)"
        [class.active]="p === currentPage">
        {{ p }}
      </button>
      <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages">›</button>
    </div>

  </div>
</div>
