<div class="app-container">

  <!-- Sidebar -->
  <div [class]="sidebarOpen ? 'sidebar open' : 'sidebar'">
    <div class="sidebar-content">
      <h2>Mon Espace</h2>
      <nav>
        <a href="#">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="7" rx="1" stroke-width="2"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="compagne">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <span>Lancer une campagne</span>
        </a>

        <a href="commande_service" class="active">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>Choisir un service</span>
        </a>

        <a href="profil">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Profil</span>
        </a>

        <a (click)="logout(); $event.preventDefault()">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span>Se déconnecter</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Main -->
  <div class="main-wrapper">

    <!-- Header -->
    <header>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1>Nos Services</h1>
      <div class="spacer"></div>
    </header>

    <!-- Content -->
<div class="sv-content">

  <!-- Liste des services -->
  <div class="sv-grid">
    <ng-container *ngFor="let service of services">

      <!-- Card service -->
      <div class="sv-card"
           [class.sv-card-active]="selectedService?.id === service.id"
           (click)="selectService(service)">
        <img *ngIf="service.image" [src]="service.image" class="sv-card-img" />
        <div class="sv-card-body">
          <h3 class="sv-card-title">{{ service.title }}</h3>
        </div>
        <div class="sv-card-arrow">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  [attr.d]="selectedService?.id === service.id ? 'M19 9l-7 7-7-7' : 'M9 5l7 7-7 7'"/>
          </svg>
        </div>
      </div>

      <!-- Détails sous la card — pleine largeur -->
      <div class="sv-details sv-details-inline"
           *ngIf="selectedService?.id === service.id"
           style="grid-column: 1 / -1;">
        <div class="sv-details-header">
          <h2 class="sv-details-title">
            <span class="sv-accent">{{ service.title }}</span> — Choisissez vos prestations
          </h2>
          <!-- Bouton commander global -->

        </div>

        <div class="sv-details-grid">
          <div class="sv-detail-card"
               *ngFor="let detail of serviceDetails"
               [class.sv-detail-selected]="detail.checked"
               (click)="toggleDetail(detail); $event.stopPropagation()">
            <div class="sv-detail-check">
              <input type="checkbox" [(ngModel)]="detail.checked"
                     (click)="$event.stopPropagation()" />
            </div>
            <p class="sv-detail-title">{{ detail.title }}</p>
          </div>
        </div>
<div style="display: flex; justify-content: flex-end; margin-top: 16px;">
  <button class="sv-btn-commander-global"
          (click)="commanderSelected(service.title); $event.stopPropagation()"
          [disabled]="getSelectedCount() === 0">
    <svg width="16" height="16" fill="none" stroke="white" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    Commander ({{ getSelectedCount() }})
  </button>
</div>       
      </div>

    </ng-container>
  </div>

</div>
  </div>
</div>
