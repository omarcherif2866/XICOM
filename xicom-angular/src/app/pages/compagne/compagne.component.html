<div class="pj-wrapper">

  <!-- Stepper -->
  <div class="pj-stepper">
    <div class="pj-step"
      *ngFor="let step of steps"
      [class.active]="currentStep === step.number"
      [class.done]="currentStep > step.number"
      (click)="goTo(step.number)">
      <div class="pj-step-circle">
        <svg *ngIf="currentStep > step.number" width="16" height="16"
             viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span *ngIf="currentStep <= step.number">{{ step.number }}</span>
      </div>
      <p class="pj-step-label">{{ step.label }}</p>
    </div>
    <div class="pj-step-line"></div>
  </div>

  <!-- Success -->
  <div class="pj-success" *ngIf="submitted">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
    <p>{{ successMessage }}</p>
  </div>

  <div class="pj-card" *ngIf="!submitted">

    <!-- ===== STEP 1 ===== -->
    <div *ngIf="currentStep === 1" [formGroup]="step1Form">
      <h2 class="pj-title"><span class="pj-title-accent">Infos</span> & Stratégie</h2>

      <div class="pj-row">
        <label>Nom de la campagne</label>
        <input class="pj-input" formControlName="nomCampagne" placeholder="Nom de la campagne" />
      </div>
      <div class="pj-row">
        <label>Date de début</label>
        <input class="pj-input" type="date" formControlName="dateDebut" />
      </div>
      <div class="pj-row">
        <label>Date de fin</label>
        <input class="pj-input" type="date" formControlName="dateFin" />
      </div>
      <div class="pj-row">
        <label>Budget total</label>
        <input class="pj-input" type="number" formControlName="budgetTotal" placeholder="0.00" />
      </div>
      <div class="pj-row">
        <label>Objectifs</label>
        <textarea class="pj-input" formControlName="objectifs" placeholder="Objectifs de la campagne" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Cible</label>
        <input class="pj-input" formControlName="cible" placeholder="Public cible" />
      </div>
      <div class="pj-row">
        <label>Canaux de communication</label>
        <input class="pj-input" formControlName="canauxCommunication" placeholder="Email, social media..." />
      </div>
      <div class="pj-row">
        <label>Message clé</label>
        <textarea class="pj-input" formControlName="messageCle" placeholder="Message principal" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Concept</label>
        <textarea class="pj-input" formControlName="concept" placeholder="Concept créatif" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Brief</label>
        <textarea class="pj-input" formControlName="brief" placeholder="Brief de la campagne" rows="3"></textarea>
      </div>

      <div class="pj-section-label">Stratégie</div>

      <div class="pj-row">
        <label>Analyse de la situation</label>
        <textarea class="pj-input" formControlName="analyseSituation" placeholder="Analyse SWOT, contexte..." rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Objectif stratégique</label>
        <textarea class="pj-input" formControlName="objectif" placeholder="Objectif principal" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Date limite (deadline)</label>
        <input class="pj-input" type="date" formControlName="dateLine" />
      </div>
    </div>

    <!-- ===== STEP 2 ===== -->
    <div *ngIf="currentStep === 2" [formGroup]="step2Form">
      <h2 class="pj-title"><span class="pj-title-accent">Exécution</span> & Évaluation</h2>

      <div class="pj-row">
        <label>Ciblage</label>
        <input class="pj-input" formControlName="ciblage" placeholder="Segments ciblés" />
      </div>
      <div class="pj-row">
        <label>Message & mots-clés</label>
        <textarea class="pj-input" formControlName="messageMotsCles" placeholder="Mots-clés, tonalité..." rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Stratégie canaux de communication</label>
        <textarea class="pj-input" formControlName="strategieCanauxCommunication" placeholder="Plan de diffusion par canal" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Benchmark & analyse concurrentielle</label>
        <textarea class="pj-input" formControlName="benchmarkAnalyseConcurrentielle" placeholder="Analyse des concurrents" rows="3"></textarea>
      </div>

      <div class="pj-section-label">Exécution</div>

      <div class="pj-row">
        <label>Création de contenu</label>
        <textarea class="pj-input" formControlName="creationContenu" placeholder="Détails sur le contenu à créer" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Test préliminaire</label>
        <textarea class="pj-input" formControlName="testPreliminaire" placeholder="A/B test, focus group..." rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Ajustement</label>
        <textarea class="pj-input" formControlName="ajustement" placeholder="Modifications suite aux tests" rows="3"></textarea>
      </div>

      <div class="pj-section-label">Évaluation</div>

      <div class="pj-row">
        <label>Post-évaluation</label>
        <textarea class="pj-input" formControlName="postEvaluation" placeholder="Bilan après campagne" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Analyses des données</label>
        <textarea class="pj-input" formControlName="analysesDonnees" placeholder="KPIs, métriques..." rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Compilation des données</label>
        <textarea class="pj-input" formControlName="compilationDonnees" placeholder="Synthèse des résultats" rows="3"></textarea>
      </div>
      <div class="pj-row">
        <label>Rapport final</label>
        <textarea class="pj-input" formControlName="rapportFinal" placeholder="Rapport complet de la campagne" rows="4"></textarea>
      </div>
    </div>

    <!-- Navigation -->
    <div class="pj-nav">
      <button class="pj-btn-prev" type="button" (click)="prev()" *ngIf="currentStep > 1">
        ← Précédent
      </button>
      <button class="pj-btn-next" type="button" (click)="next()" *ngIf="currentStep < totalSteps">
        Suivant →
      </button>
      <button class="pj-btn-submit" type="button" (click)="submit()" *ngIf="currentStep === totalSteps">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Enregistrer la campagne
      </button>
    </div>

  </div>
</div>
