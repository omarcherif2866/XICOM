<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>XI_COM - Transformez votre présence en ligne avec XI_COM !</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="XI_COM - Solutions digitales innovantes pour transformer votre présence en ligne">
  <link rel="icon" type="image/x-icon" href="../../../assets/logo/logo.webp">

  <!-- ✅ Préchargement image LCP -->
  <link rel="preload" 
        as="image" 
        href="assets/images/hero-illustration.webp"
        type="image/webp">

  <!-- ✅ Fonts en différé -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">

  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
  </noscript>

  <!-- ✅ Font Awesome en différé -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </noscript>

  <!-- ✅ Tabler icons en différé -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  </noscript>

  <!-- ✅ Scripts en différé -->
  <!-- <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://sandbox.web.squarecdn.com/v1/square.js" defer></script> -->
</head>
<body>
    <app-root>
    <div id="xi-loader" style="
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
    ">
      <img src="assets/logo/Asset 34@4x.png" 
           alt="XI COM"
           style="width: 100px; margin-bottom: 24px;">
      
      <div style="
        width: 40px; height: 40px;
        border: 3px solid #f0ebff;
        border-top-color: #6341c4;
        border-radius: 50%;
        animation: xi-spin 0.7s linear infinite;
        margin-bottom: 16px;
      "></div>

      <!-- ✅ Timer -->
      <div id="xi-timer" style="
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        color: #9090b0;
        letter-spacing: 0.05em;
      ">0.00s</div>
    </div>

    <style>
      @keyframes xi-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </app-root>

  <!-- ✅ Script timer -->
  <script>
    const startTime = performance.now();
    const timerEl = document.getElementById('xi-timer');

    const interval = setInterval(() => {
      if (!timerEl) { clearInterval(interval); return; }
      const elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
      timerEl.textContent = elapsed + 's';
    }, 50);

    // ✅ Arrêter quand Angular prend le contrôle
    window.addEventListener('load', () => {
      clearInterval(interval);
      const total = ((performance.now() - startTime) / 1000).toFixed(2);
      if (timerEl) timerEl.textContent = '✅ Chargé en ' + total + 's';
    });
  </script>
</body>
</html>
